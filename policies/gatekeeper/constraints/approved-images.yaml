apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sApprovedImages
metadata:
  name: approved-image-registries
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaceSelector:
      matchLabels:
        pci-cde: "true"
  parameters:
    approvedRegistries:
      - "registry.k8s.io"
      - "registry.corp.example"
      - "gcr.io/trusted"
