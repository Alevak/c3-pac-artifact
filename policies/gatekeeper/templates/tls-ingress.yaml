apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8stlsingress
spec:
  crd:
    spec:
      names:
        kind: K8sTLSIngress
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8stlsingress
        violation[{"msg": msg}] {
          input.review.kind.kind == "Ingress"
          not valid_tls
          msg := sprintf("[PCI-Req4.2.1/NIS2-Art21e] Ingress missing or empty TLS: %v", [input.review.object.metadata.name])
        }
        valid_tls {
          tls := input.review.object.spec.tls
          count(tls) > 0
          tls[_].secretName
        }
